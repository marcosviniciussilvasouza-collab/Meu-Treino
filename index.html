<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14202b;--mu:#667585;--ac:#2457c5;--acx:#fff;--bd:#d9e0e7;--pr:#b7791f;--in:#f4f6f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#19222c;--tx:#e8eef4;--mu:#8fa0b0;--ac:#6f9cf0;--acx:#0d1520;--bd:#2a3644;--pr:#e0a73a;--in:#111a23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#19222c;--tx:#e8eef4;--mu:#8fa0b0;--ac:#6f9cf0;--acx:#0d1520;--bd:#2a3644;--pr:#e0a73a;--in:#111a23;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:12px 12px 90px}
h1{font-size:22px;margin:4px 0 10px;font-weight:800;letter-spacing:-.01em}
.tabs,.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button,.days button{flex:1 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;border-radius:10px;font:inherit;font-weight:600}
.tabs button.on,.days button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.meta{color:var(--mu);font-size:14px;margin:10px 2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0;font-size:17px}
.rx{color:var(--mu);font-size:14px}
.last{color:var(--mu);font-size:13px;margin:2px 0 8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.set b{color:var(--mu);font-weight:600;text-align:center}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:10px;font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.primary{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;margin-top:6px}
.ghost{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;justify-content:center;max-width:560px;margin-inline:auto}
.timer span{font-variant-numeric:tabular-nums;font-weight:800;min-width:54px;text-align:center}
.timer button{padding:8px 10px}
.stat{display:flex;gap:10px}.stat div{flex:1;background:var(--in);border-radius:10px;padding:8px}
.stat small{display:block;color:var(--mu)}.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.hist{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
.hist:first-of-type{border-top:0}
.pr{color:var(--pr);font-weight:700}
svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;z-index:5}
details{margin-top:14px}summary{font-weight:600;padding:6px 0}
.eh{display:flex;gap:10px;align-items:center;margin-bottom:2px}.an{width:64px;height:64px;flex:none;background:var(--in);border-radius:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.sp{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd);text-decoration:none;font-weight:700;padding:8px 14px 8px 10px;border-radius:999px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="top"><h1>Diário de treino</h1><a class="sp" href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" aria-label="Abrir o Spotify"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1db954"/><g fill="none" stroke="#0b1a10" stroke-linecap="round"><path d="M5.5 8.6c4.2-1.2 8.8-.9 12.6 1.3" stroke-width="2"/><path d="M6.3 12.3c3.5-1 7.3-.7 10.4 1.1" stroke-width="1.7"/><path d="M7 15.8c2.9-.8 5.8-.5 8.4.9" stroke-width="1.4"/></g></svg>Spotify</a></div>

<script>
var PLAN={
"Superiores A":[["Supino reto com barra","4x4-6"],["Remada curvada ou cavalinho","4x5-8"],["Desenvolvimento militar","3x6-8"],["Barra fixa ou puxada alta","3x6-10"],["Supino inclinado com halteres","3x8-10"],["Rosca direta","3x8-10"],["Tríceps testa ou paralelas","3x8-10"]],
"Inferiores A":[["Agachamento livre","4x4-6"],["Stiff","4x6-8"],["Leg press 45°","3x8-10"],["Mesa flexora","3x8-12"],["Panturrilha em pé","4x8-12"],["Abdominal com carga","3x10-12"]],
"Superiores B":[["Supino inclinado com halteres","4x8-12"],["Puxada alta (pegada aberta)","4x8-12"],["Elevação lateral","4x12-15"],["Remada baixa","3x10-12"],["Crucifixo ou crossover","3x12-15"],["Rosca alternada","3x10-12"],["Tríceps corda","3x10-12"],["Face pull","3x15"]],
"Inferiores B":[["Leg press ou agachamento hack","4x8-12"],["Avanço ou afundo (por perna)","3x10-12"],["Cadeira extensora","3x12-15"],["Mesa ou cadeira flexora","4x10-12"],["Elevação pélvica","3x8-12"],["Panturrilha sentado","4x12-15"]],
"Superiores C":[["Supino inclinado com barra","4x4-6"],["Remada sentada ou unilateral","4x5-8"],["Desenvolvimento com halteres","3x6-8"],["Barra fixa ou puxada alta","3x6-10"],["Supino reto com halteres","3x8-10"],["Rosca martelo","3x8-10"],["Tríceps testa ou paralelas","3x8-10"]],
"Inferiores C":[["Leg press ou agachamento hack","4x8-12"],["Avanço ou afundo (por perna)","3x10-12"],["Cadeira extensora","3x12-15"],["Mesa ou cadeira flexora","4x10-12"],["Elevação pélvica","3x8-12"],["Panturrilha sentado","4x12-15"]]
};
var DAYS=Object.keys(PLAN),BYWEEK={1:0,2:1,3:2,4:3,5:4,6:5,0:0};
var KEY="treino_v1",db={sessions:[]},tab="t",day=DAYS[BYWEEK[new Date().getDay()]],cur={},selEx="";
try{var s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Não foi possível salvar neste navegador")}}
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtD(i){var p=i.split("-");return p[2]+"/"+p[1]}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function nSets(p){return parseInt(p,10)}
function e1rm(w,r){return w*(1+r/30)}
function r1(x){return Math.round(x*10)/10}
function lastSets(name){for(var i=db.sessions.length-1;i>=0;i--){var e=db.sessions[i].ex[name];if(e&&e.length)return e}return null}
function loadCur(){cur={};var t=today();var ss=db.sessions.filter(function(x){return x.date===t&&x.day===day})[0];if(ss)cur=JSON.parse(JSON.stringify(ss.ex))}
function viewT(){
  var h='<div class="days">'+DAYS.map(function(d){return '<button data-day="'+d+'"'+(d===day?' class="on"':'')+'>'+d.replace("Superiores","Sup.").replace("Inferiores","Inf.")+'</button>'}).join("")+'</div>';
  h+='<p class="meta">'+fmtD(today())+' · '+day+'. Registre carga (kg) e repetições de cada série.</p>';
  PLAN[day].forEach(function(ex,i){
    var n=nSets(ex[1]),l=lastSets(ex[0]),c=cur[ex[0]]||[];
    h+='<div class="card"><div class="eh">'+icon(ex[0])+'<div><h3>'+ex[0]+'</h3><div class="rx">Meta: '+ex[1].replace("x"," × ")+' repetições</div></div></div>';
    h+='<div class="last">'+(l?'Última vez: '+l.map(function(s){return s.w+'×'+s.r}).join(", "):'Sem registro ainda')+'</div>';
    for(var j=0;j<n;j++){var v=c[j]||{},p=l&&l[j]?l[j]:{};
      h+='<div class="set"><b>'+(j+1)+'</b><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="'+(p.w!=null?p.w:'kg')+'" value="'+(v.w!=null?v.w:'')+'" data-e="'+i+'" data-s="'+j+'" data-k="w" aria-label="Carga série '+(j+1)+'"><input type="number" inputmode="numeric" min="0" placeholder="'+(p.r!=null?p.r:'reps')+'" value="'+(v.r!=null?v.r:'')+'" data-e="'+i+'" data-s="'+j+'" data-k="r" aria-label="Repetições série '+(j+1)+'"></div>';}
    h+='</div>';
  });
  return h+'<button class="primary" id="save">Salvar treino</button>';
}
function bestOf(sets){var b=0;sets.forEach(function(s){var v=e1rm(s.w,s.r);if(v>b)b=v});return b}
function viewP(){
  if(!db.sessions.length)return '<div class="card"><h3>Nada registrado</h3><p class="rx">Salve o primeiro treino na aba Treinar para ver a evolução das cargas aqui.</p></div>'+backup();
  var names={};db.sessions.forEach(function(s){for(var k in s.ex)names[k]=1});
  var list=Object.keys(names).sort();if(!selEx||!names[selEx])selEx=list[0];
  var pts=[];db.sessions.forEach(function(s){var e=s.ex[selEx];if(e&&e.length){var top=e.reduce(function(a,b){return b.w>a.w?b:a});pts.push({d:s.date,v:bestOf(e),top:top})}});
  var maxv=Math.max.apply(null,pts.map(function(p){return p.v})),first=pts[0].v,last=pts[pts.length-1].v;
  var wk={};db.sessions.forEach(function(s){var d=new Date(s.date+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));wk[d.toDateString()]=1});
  var h='<div class="card"><div class="stat"><div><small>Treinos</small><strong>'+db.sessions.length+'</strong></div><div><small>Semanas ativas</small><strong>'+Object.keys(wk).length+'</strong></div></div></div>';
  h+='<div class="card"><select id="sel" aria-label="Exercício">'+list.map(function(n){return '<option'+(n===selEx?' selected':'')+'>'+n+'</option>'}).join("")+'</select>';
  h+='<div class="stat" style="margin-top:10px"><div><small>1RM estimado atual</small><strong>'+r1(last)+' kg</strong></div><div><small>Variação desde o início</small><strong>'+(last>=first?'+':'')+r1(last-first)+' kg</strong></div></div>';
  h+=chart(pts,maxv)+'<div>';
  pts.slice().reverse().forEach(function(p){h+='<div class="hist"><span>'+fmtD(p.d)+'</span><span>'+p.top.w+' kg × '+p.top.r+'</span><span class="'+(p.v===maxv?'pr':'')+'">'+r1(p.v)+' kg'+(p.v===maxv?' · recorde':'')+'</span></div>'});
  h+='</div></div><div class="card"><h3>Treinos salvos</h3>';
  db.sessions.slice().reverse().slice(0,15).forEach(function(s){h+='<div class="hist"><span>'+fmtD(s.date)+' · '+s.day+'</span><button class="ghost" data-del="'+s.date+'|'+s.day+'">Apagar</button></div>'});
  return h+'</div>'+backup();
}
function chart(pts,maxv){
  if(pts.length<2)return '<p class="rx">Registre mais um treino deste exercício para ver o gráfico.</p>';
  var W=320,H=130,P=22,vs=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vs),mx=maxv;if(mx===mn){mx=mn+1}
  var xy=pts.map(function(p,i){return [P+i*(W-2*P)/(pts.length-1),H-P-(p.v-mn)/(mx-mn)*(H-2*P)]});
  var d=xy.map(function(q,i){return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)}).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do 1RM estimado"><path d="'+d+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>'+xy.map(function(q,i){return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(pts[i].v===maxv?5:3.5)+'" fill="'+(pts[i].v===maxv?'var(--pr)':'var(--ac)')+'"/>'}).join("")+'<text x="'+P+'" y="'+(H-4)+'" font-size="10" fill="var(--mu)">'+fmtD(pts[0].d)+'</text><text x="'+(W-P)+'" y="'+(H-4)+'" font-size="10" text-anchor="end" fill="var(--mu)">'+fmtD(pts[pts.length-1].d)+'</text></svg>';
}
function backup(){return '<details><summary>Backup dos dados</summary><p class="rx">Os dados ficam salvos neste navegador. Copie o backup de vez em quando; para restaurar, cole o texto e toque em Importar.</p><textarea id="bk" rows="4"></textarea><div class="row"><button class="ghost" id="exp">Exportar</button><button class="ghost" id="imp">Importar</button></div></details>'}
var tm=0,tid=null;
function drawTimer(){document.getElementById("timer").innerHTML='<span>'+(tm>0?Math.floor(tm/60)+":"+pad(tm%60):"Descanso")+'</span>'+[30,60,90,150,180].map(function(s){return '<button class="ghost" data-t0="'+s+'">'+(s>=120?Math.floor(s/60)+":"+pad(s%60):s+"s")+'</button>'}).join("")}
function startT(s){clearInterval(tid);tm=s;drawTimer();tid=setInterval(function(){tm--;if(tm<=0){clearInterval(tid);tm=0;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}toast("Descanso terminou")}drawTimer()},1000)}
function render(){
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.className=b.dataset.t===tab?"on":""});
  document.getElementById("app").innerHTML=tab==="t"?viewT():viewP();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){tab=b.dataset.t;render();return}
  if(b.dataset.day){day=b.dataset.day;loadCur();render();return}
  if(b.dataset.t0){startT(+b.dataset.t0);return}
  if(b.id==="save"){
    var ex={};PLAN[day].forEach(function(p){var a=(cur[p[0]]||[]).filter(function(s){return s&&s.w!=null&&s.r!=null&&s.w!==""&&s.r!==""}).map(function(s){return{w:+s.w,r:+s.r}});if(a.length)ex[p[0]]=a});
    if(!Object.keys(ex).length){toast("Preencha carga e repetições de ao menos uma série");return}
    var t=today();db.sessions=db.sessions.filter(function(x){return!(x.date===t&&x.day===day)});db.sessions.push({date:t,day:day,ex:ex});db.sessions.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});persist();toast("Treino salvo");return}
  if(b.dataset.del){var q=b.dataset.del.split("|");if(confirm("Apagar este treino?")){db.sessions=db.sessions.filter(function(x){return!(x.date===q[0]&&x.day===q[1])});persist();render()}return}
  if(b.id==="exp"){var ta=document.getElementById("bk");ta.value=JSON.stringify(db);ta.select();try{navigator.clipboard.writeText(ta.value);toast("Backup copiado")}catch(x){toast("Selecione e copie o texto")}return}
  if(b.id==="imp"){try{var o=JSON.parse(document.getElementById("bk").value);if(!o.sessions)throw 0;db=o;persist();render();toast("Backup importado")}catch(x){toast("Texto de backup inválido")}}
});
document.addEventListener("input",function(e){var i=e.target;if(i.dataset.e==null)return;var n=PLAN[day][+i.dataset.e][0];cur[n]=cur[n]||[];cur[n][+i.dataset.s]=cur[n][+i.dataset.s]||{};cur[n][+i.dataset.s][i.dataset.k]=i.value===""?null:+i.value});
document.addEventListener("change",function(e){if(e.target.id==="sel"){selEx=e.target.value;render()}});
